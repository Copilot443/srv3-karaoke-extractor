name: Build Executables

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            output: srv3.exe
            renamed: srv3-windows.exe
            artifact: srv3-windows
          - os: ubuntu-latest
            output: srv3
            renamed: srv3-linux
            artifact: srv3-linux
          - os: macos-latest
            output: srv3
            renamed: srv3-macos
            artifact: srv3-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: pyinstaller --onefile srv3.py

      - name: Rename binary
        shell: bash
        run: mv dist/${{ matrix.output }} dist/${{ matrix.renamed }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.renamed }}

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.renamed }}
